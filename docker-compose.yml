services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: protocol-normalizer-backend
    command: sh -c "python -m scripts.db_prepare && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - backend/.env
    environment:
      PYTHONPATH: /app/backend
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    volumes:
      - ./data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:18000/api}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
    container_name: protocol-normalizer-frontend
    ports:
      - "${FRONTEND_PORT:-15173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
